[project]
name = "roadmap-lab"
version = "0.0.0"
description = "Repo tooling only. Each folder under skeletons/ and examples/ is its own project."
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "mypy==2.4.0",
  "pre-commit==4.7.0",
]

[tool.uv]
package = false

[tool.mypy]
strict = true
mypy_path = "scripts"
files = ["scripts", "tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
